<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Employee Commute App Analysis</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body class="bg-white">
<div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-40 z-[900] hidden lg:hidden"></div>
<div class="flex h-screen overflow-hidden">

<!-- Notification -->
<div id="notification" 
     class="fixed top-4 right-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded shadow-lg 
            opacity-0 translate-y-[-20px] transition-all duration-500 ease-in-out pointer-events-none max-w-[90] break-words z-[1200]">
  <strong class="font-bold" id="notificationTitle">Notice: </strong>
  <span class="block sm:inline" id="notificationMessage">No scenarios selected</span>
</div>


<!-- Sidebar -->
<div id="hs-sidebar-content-push-to-mini-sidebar" 
    class="fixed lg:relative z-[1100] h-full w-64 bg-white border-r border-gray-200 transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
  
  <div class="relative flex flex-col h-full max-h-full">
     <header class="py-4 px-12 flex justify-between items-center gap-x-4">
        <a class="flex-none font-semibold text-xl text-gray-900" href="#">HAWORTH</a>
      </header>
	  
<nav class="h-full overflow-y-auto">
        <div class="pb-0 px-2 w-full flex flex-col flex-wrap">
          <ul class="space-y-1">
            <li>
              <a class="sidebar-link min-h-[36px] flex items-center gap-x-3.5 py-2 px-2.5 
                         rounded-lg text-sm 
                         bg-gray-200 text-gray-900" href="#" data-type="homeTab">
				<svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                  <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>Home</span>
              </a>
            </li>
            <li>
              <a class="sidebar-link min-h-[36px] flex items-center gap-x-3.5 py-2 px-2.5 
                         rounded-lg text-sm 
                         text-gray-700 hover:bg-gray-300 focus:bg-gray-400" href="#" data-type="scenariosTab">
					 <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15.5 2H8.6c-.4 0-.8.2-1.1.5-.3.3-.5.7-.5 1.1v12.8c0 .4.2.8.5 1.1.3.3.7.5 1.1.5h9.8c.4 0 .8-.2 1.1-.5.3-.3.5-.7.5-1.1V6.5L15.5 2z"/>
                  <path d="M3 7.6v12.8c0 .4.2.8.5 1.1.3.3.7.5 1.1.5h9.8"/>
                  <path d="M15 2v5h5"/>
                </svg>
                <span>Scenarios</span>
              </a>
            </li>
            <li>
              <a class="sidebar-link min-h-[36px] flex items-center gap-x-3.5 py-2 px-2.5 
                         rounded-lg text-sm 
                         text-gray-700 hover:bg-gray-300 focus:bg-gray-400" href="#"data-type="insightsTab">
						 <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
                <span>Insights</span>
              </a>
            </li>
          </ul>
        </div>
      </nav>
  </div>
</div>

<button id="menuToggle" class="lg:hidden fixed top-4 right-4 z-[1100] bg-blue-600 text-white p-2 rounded-md shadow">=</button>


<!-- Main Content -->
<div class="flex-1 flex flex-col p-4 sm:p-6 min-h-0 overflow-hidden">

<!-- Tabs -->
<div id="homeTab" class="tab-content flex flex-col flex-1 min-h-0">
  <div class="flex flex-col xl:flex-row xl:items-end gap-4 xl:gap-6 w-full flex-shrink-0">
    <!-- File Upload -->
    <div class="w-full lg:flex-1">
      <label class="block text-sm font-medium text-gray-700 mb-2"
	  >Upload Excel File (Name, Latitude, Longitude)
	  </label>	  
	  <div class="relative flex items-center justify-center w-full h-16 border-2 border-dashed border-blue-400 rounded-lg bg-blue-50 cursor-pointer hover:bg-blue-100">
        <input type="file" id="fileUpload" accept=".xlsx,.xls" 
		class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"/>
        <span id="filePlaceholder" class="text-blue-600 font-semibold">Click or Drag & Drop Excel File</span>
      </div>
    </div>

    <!-- WFO Days -->
    <div  class ="w-full lg:w-auto">
      <label for="wfoDays" class="block text-sm font-medium text-gray-700 mb-2">WFO Days</label>
      <input type="number" id="wfoDays" min="1" max="7" value="3" 
	 class="w-full xl:w-24 border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>

      <!-- Buttons -->
      <div class="flex flex-col justify-center xl:justify-start mt-2 xl:mt-0">
        <div class="flex flex-wrap gap-3 justify-center xl:justify-start">
          <button id="runScenario" type="submit" class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-blue-600 border border-blue-700 text-white hover:bg-blue-700 focus:outline-hidden focus:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
            <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Play/Run Scenario icon -->
      <polygon points="5 3 19 12 5 21 5 3"/>
    </svg>
	Run Scenario
          </button>
          <button id="resetAll" type="reset" class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-gray-500 border border-gray-600 text-white shadow-sm hover:bg-gray-600 focus:outline-hidden focus:bg-gray-600 disabled:opacity-50 disabled:pointer-events-none">
           	<svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Reset/Refresh icon -->
      <polyline points="23 4 23 10 17 10"/>
      <polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.13-3.36L23 10"/>
      <path d="M20.49 15a9 9 0 0 1-14.13 3.36L1 14"/>
    </svg>
	Reset
		
  </button>
  </div>
      </div>
    </div>

    <!-- Divider line -->
    <div class="border-t border-gray-300 mt-6"></div>
	
	 
 <!-- Map fills remaining space -->
  <div id="map" class="flex-1 w-full mt-6 rounded-lg shadow-md border border-gray-200 relative-z-0"></div>
	 
  </div>

  <!-- Other tabs -->
  <div id="scenariosTab" class="tab-content hidden">
    <h2 class="text-2xl font-bold mb-4">Scenarios</h2>
    <div id="scenarioTables"></div>
    <canvas id="pieChart" class="mt-4 w-full max-w-md"></canvas>
  </div>

  <div id="insightsTab" class="tab-content hidden">
    <h2 class="text-2xl font-bold mb-4">Final Insights</h2>
    <div id="finalInsights"></div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
let employeeData = [];
let officeLocation = null;
let officeMarker = null;
const map = L.map('map').setView([13.0827, 80.2707], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {}).addTo(map);

// Sidebar switching
document.querySelectorAll(".sidebar-link").forEach(link=>{
  link.addEventListener("click", e=>{
    e.preventDefault();
    document.querySelectorAll(".tab-content").forEach(tab=>tab.classList.add("hidden"));
    document.getElementById(link.dataset.type).classList.remove("hidden");
    document.querySelectorAll(".sidebar-link").forEach(l=>l.classList.remove("bg-gray-200","text-gray-900"));
    link.classList.add("bg-gray-200","text-gray-900");
    if(link.dataset.type === "homeTab") setTimeout(()=> map.invalidateSize(), 150);
  });
});

//sidebar toggle script

const menuBtn = document.getElementById("menuToggle");
const sidebar = document.getElementById("hs-sidebar-content-push-to-mini-sidebar");
const overlay = document.getElementById("sidebarOverlay");

menuBtn.addEventListener("click", () => {
  sidebar.classList.toggle("-translate-x-full");
  overlay.classList.toggle("hidden");
});

overlay.addEventListener("click", () => {
  sidebar.classList.add("-translate-x-full");
  overlay.classList.add("hidden");
});

//shownotifcation
function showNotification(message){
  const notification = document.getElementById("notification");
  const messageSpan = document.getElementById("notificationMessage");
  messageSpan.textContent = message;

  notification.classList.add("opacity-100","translate-y-0");
  setTimeout(()=>{
    notification.classList.remove("opacity-100","translate-y-0");
  }, 3000);
}

// Map click to set office
map.on('click', function(e) {
  const { lat, lng } = e.latlng;
  officeLocation = [lat, lng];
  if(officeMarker) map.removeLayer(officeMarker);
  officeMarker = L.marker([lat, lng], { draggable: true }).addTo(map).bindPopup('Office Location').openPopup();
});

// File upload
document.getElementById("fileUpload").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  const placeholder = document.getElementById("filePlaceholder");
  if(file) placeholder.textContent = file.name; else placeholder.textContent = "Click or Drag & Drop Excel File";

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch("/upload",{method:"POST", body: formData});
    const data = await res.json();
    employeeData = data;
    renderMap(employeeData);
    renderTable(employeeData);
    renderPieChart(employeeData);
  } catch(err){ console.error(err); }
});

// Run scenario
document.getElementById("runScenario").addEventListener("click", async () => {
  if(!officeLocation){ alert("Select office on map"); return; }
  if(employeeData.length===0){ alert("Upload file first"); return; }


const wfo = parseInt(document.getElementById("wfoDays").value);
  const response = await fetch("/run_scenario", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ employees: employeeData, wfo_days:wfo, office:{latitude:officeLocation[0], longitude:officeLocation[1]} })
  });
  const result = await response.json();
  employeeData = result.employees;
  renderMap(employeeData);
  renderTable(employeeData);
  renderPieChart(employeeData);
  renderInsights(result);
});


// Render functions
function renderTable(data){
  const container = document.getElementById("scenarioTables");
  container.innerHTML="";
  if(!data.length) return;
  const table=document.createElement("table");
  table.className="min-w-full bg-white border";
  table.innerHTML=`<thead><tr>${Object.keys(data[0]).map(k=>`<th class="px-4 py-2 border">${k}</th>`).join('')}</tr></thead>
    <tbody>${data.map(r=>`<tr>${Object.values(r).map(v=>`<td class="px-4 py-2 border">${v}</td>`).join('')}</tr>`).join('')}</tbody>`;
  container.appendChild(table);
}

function renderPieChart(data){
  const low=data.filter(e=>e.travel_time_min<30).length;
  const moderate=data.filter(e=>e.travel_time_min>=30 && e.travel_time_min<=45).length;
  const high=data.filter(e=>e.travel_time_min>45).length;
  const ctx=document.getElementById("pieChart").getContext("2d");
  if(window.pieChart) window.pieChart.destroy();
  window.pieChart=new Chart(ctx,{
    type:'pie',
    data:{labels:['Low','Moderate','High'], datasets:[{data:[low,moderate,high], backgroundColor:['green','orange','red']}]}
  });
}


function renderMap(data){
  map.eachLayer(layer=>{if(layer instanceof L.CircleMarker) map.removeLayer(layer);});
  data.forEach(emp=>{
    const color = emp.travel_time_min<30 ? "green" : emp.travel_time_min<=45 ? "orange" : "red";
    L.circleMarker([emp.latitude, emp.longitude], {radius:6, color, fill:true}).addTo(map);
  });
}

function renderInsights(result){
    const container = document.getElementById("finalInsights");
    let html = `<h3 class="text-xl font-semibold mt-2">Office Metrics</h3>
    <p>Fit Score: <strong>${result.office_fit_pct}%</strong> (${result.office_fit_label})</p>
    <p>Average Commute: <strong>${result.avg_commute_time} min</strong></p>
    <h3 class="text-xl font-semibold mt-2">Commute Burden Concentration</h3>
    <ul>
    <li>Low: ${result.commute_distribution.low}%</li>
    <li>Moderate: ${result.commute_distribution.medium}%</li>
    <li>High: ${result.commute_distribution.high}%</li>
    </ul>
    <h3 class="text-xl font-semibold mt-2">Cluster Opportunities</h3>
    <ul>
    ${result.cluster_summary.map(c=>`<li>Cluster ${c.cluster}: ${c.members} employees, avg commute ${c.avg_commute} min</li>`).join('')}
    </ul>
    <h3 class="text-xl font-semibold mt-2">WFO Impact</h3>
    <p>Avg commute/week: <strong>${result.avg_commute_per_week} hrs</strong></p>
    <p>CO₂ impact/week: <strong>${result.co2_per_week} kg</strong></p>
    <p>Marginal per WFO day: <strong>${result.marginal_commute_per_day} hrs</strong>, <strong>${result.marginal_co2_per_day} kg</strong></p>
    `;
    container.innerHTML = html;
}


// Reset
document.getElementById("resetAll").addEventListener("click", ()=>{
  employeeData=[]; officeLocation=null;
  if(officeMarker) map.removeLayer(officeMarker); officeMarker=null;
  map.setView([13.0827,80.2707],12);
  document.getElementById("scenarioTables").innerHTML="";
  if(window.pieChart) window.pieChart.destroy();
  document.getElementById("finalInsights").innerHTML="";
  document.getElementById("filePlaceholder").textContent="Click or Drag & Drop Excel File";
});
</script>
</body>
</html>

<script>
  let employeeData = [];
  const map = L.map('map').setView([13.0827, 80.2707], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {}).addTo(map);
  
  let officeLocation = null; // stores [lat, lng] once user clicks on map
let officeMarker = null;

  // Sidebar tab switching
document.querySelectorAll(".sidebar-link").forEach(link=>{
  link.addEventListener("click", e=>{
    e.preventDefault();

    document.querySelectorAll(".tab-content").forEach(tab=>tab.classList.add("hidden"));
    document.getElementById(link.dataset.type).classList.remove("hidden");

    document.querySelectorAll(".sidebar-link").forEach(l=>l.classList.remove("bg-gray-200","text-gray-900"));
    link.classList.add("bg-gray-200","text-gray-900");

    if(link.dataset.type === "homeTab"){
      setTimeout(()=> map.invalidateSize(), 150);
    }
  });
});

//sidebar toggle script

const menuBtn = document.getElementById("menuToggle");
const sidebar = document.getElementById("hs-sidebar-content-push-to-mini-sidebar");
const overlay = document.getElementById("sidebarOverlay");

menuBtn.addEventListener("click", () => {
  sidebar.classList.toggle("-translate-x-full");
  overlay.classList.toggle("hidden");
});

overlay.addEventListener("click", () => {
  sidebar.classList.add("-translate-x-full");
  overlay.classList.add("hidden");
});

//shownotifcation
function showNotification(message){
  const notification = document.getElementById("notification");
  const messageSpan = document.getElementById("notificationMessage");
  messageSpan.textContent = message;

  notification.classList.add("opacity-100","translate-y-0");
  setTimeout(()=>{
    notification.classList.remove("opacity-100","translate-y-0");
  }, 3000);
}

  // File upload
  

 document.getElementById("fileUpload").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  const placeholder = document.getElementById("filePlaceholder");

  // Update placeholder
  if(file){
    placeholder.textContent = file.name;
  } else {
    placeholder.textContent = "Click or Drag & Drop Excel File";
    employeeData = [];
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  try {
    const response = await fetch("/upload",{method:"POST", body: formData});

    if(!response.ok){
      // Upload failed, show notification
      const error = await response.json();
      showNotification(error.error || "Upload failed!");
      employeeData = [];
      return;
    }

    const data = await response.json();

    // Validate that required columns exist
    if(!data.every(emp => "employee_id" in emp && "latitude" in emp && "longitude" in emp)){
      showNotification("Excel missing required columns!");
      employeeData = [];
      return;
    }

    // ✅ File is valid, update employeeData
    employeeData = data;

    // Render map and table immediately
    renderMap(employeeData);
    renderTable(employeeData);
    renderPieChart(employeeData);

    // Optional: show a small success notification
    showNotification("File uploaded and mapped successfully!");

  } catch(err) {
    console.error(err);
    showNotification("Upload failed!");
    employeeData = [];
  }
});



//set office Location

map.on('click', function(e) {
  const { lat, lng } = e.latlng;
  officeLocation = [lat, lng];

  // Remove previous marker if exists
  if (officeMarker) map.removeLayer(officeMarker);

  // Add a marker for the office
  officeMarker = L.marker([lat, lng], { 
    draggable: true // optional: user can move office marker
  }).addTo(map)
    .bindPopup('Selected Office Location')
    .openPopup();
});



  // Run scenario
document.getElementById("runScenario").addEventListener("click", async () => {
  if (!officeLocation) {
    showNotification("Please select the office location on the map first!");
    return;
  }

  if (employeeData.length === 0) {
    showNotification("Upload file first!");
    return;
  }

  const wfo = parseInt(document.getElementById("wfoDays").value);

  const response = await fetch("/run_scenario", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      employees: employeeData,
      wfo_days: wfo,
      low: 30,
      medium: 45,
      office: { latitude: officeLocation[0], longitude: officeLocation[1] } // send office location to backend
    })
  });

  const result = await response.json();
  employeeData = result.employees;

  renderMap(employeeData);
  renderTable(employeeData);
  renderPieChart(employeeData);
  renderInsights(result);
  showNotification("Scenario run successfully!");
});derInsights(result);
  sho

  // Reset
  document.getElementById("resetAll").addEventListener("click", () => {
  // Clear data
  employeeData = [];

  // Clear file input
  const fileInput = document.getElementById("fileUpload");
  const filePlaceholder = document.getElementById("filePlaceholder");
  fileInput.value = "";
  filePlaceholder.textContent = "Click or Drag & Drop Excel File";

  // Clear table and pie chart
  renderTable([]);
  renderPieChart([]);
  document.getElementById("finalInsights").innerHTML = "";

  // Clear map
  map.eachLayer(layer => {
    if (layer instanceof L.CircleMarker) map.removeLayer(layer);
  });

  // Clear office marker
  if (officeMarker) {
    map.removeLayer(officeMarker);
    officeMarker = null;
    officeLocation = null;
  }

  // Reset map view
  map.setView([13.0827, 80.2707], 12);
});

  // Table rendering
  function renderTable(data){
    const container = document.getElementById("scenarioTables");
    container.innerHTML="";
    if(data.length===0) return;
    const table=document.createElement("table");
    table.className="min-w-full bg-white border";
    table.innerHTML=`<thead><tr>${Object.keys(data[0]).map(k=>`<th class="px-4 py-2 border">${k}</th>`).join('')}</tr></thead>
    <tbody>${data.map(r=>`<tr>${Object.values(r).map(v=>`<td class="px-4 py-2 border">${v}</td>`).join('')}</tr>`).join('')}</tbody>`;
    container.appendChild(table);
  }

  // Pie chart
  function renderPieChart(data){
    const low=data.filter(e=>e.travel_time_min<30).length;
    const moderate=data.filter(e=>e.travel_time_min>=30 && e.travel_time_min<=45).length;
    const high=data.filter(e=>e.travel_time_min>45).length;
    const ctx=document.getElementById("pieChart").getContext("2d");
    if(window.pieChart) window.pieChart.destroy();
    window.pieChart=new Chart(ctx,{
      type:'pie',
      data:{labels:['Low','Moderate','High'], datasets:[{data:[low,moderate,high], backgroundColor:['green','orange','red']}]}
    });
  }

  // Map rendering
  function renderMap(data){
    map.eachLayer(layer=>{if(layer instanceof L.CircleMarker) map.removeLayer(layer);});
    data.forEach(emp=>{
      const color = emp.travel_time_min<30 ? "green" : emp.travel_time_min<=45 ? "orange" : "red";
      L.circleMarker([emp.latitude, emp.longitude], {radius:6, color, fill:true}).addTo(map);
    });
  }

  // Insights rendering
  function renderInsights(result){
    const container=document.getElementById("finalInsights");
    container.innerHTML=`<p>Office Fit Score: <strong>${result.office_fit_pct}%</strong></p>
                       <p>Fit Assessment: <strong>${result.office_fit_label}</strong></p>`;
  }
</script>
